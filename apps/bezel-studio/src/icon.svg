<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Bezel app icon: a smart screen in its bezel, showing live metric bars.
    Regenerate the raster set from apps/bezel-studio/src-tauri:
      magick -background none -density 1536 icons/icon.svg -resize 1024x1024 -depth 8 -strip PNG32:icons/icon-1024.png
      cargo tauri icon icons/icon-1024.png -o icons
  -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bezel)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="40" y="40" width="176" height="176" rx="30" fill="url(#screen)"/>
  <rect x="40" y="40" width="176" height="176" rx="30" fill="url(#glass)"/>
  <rect x="66" y="132" width="30" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="113" y="100" width="30" height="92" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="160" y="68" width="30" height="124" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="84" cy="84" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="9"/>
  <path d="M84 67 A17 17 0 1 1 67 84" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
</svg>
