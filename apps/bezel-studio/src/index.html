<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bezel Evo</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" width="26" height="26" />
        <span class="brand-label">
          <span class="brand-name">Bezel Evo</span>
          <span class="brand-version" id="app-version"></span>
        </span>
      </div>
      <label class="theme-name">
        <span class="visually-hidden" data-i18n="top.themeName"></span>
        <input id="theme-name" type="text" spellcheck="false" data-i18n-aria-label="top.themeName" />
      </label>
      <div class="spacer"></div>
      <label class="screen-chip">
        <span class="visually-hidden" data-i18n="top.screen"></span>
        <span class="dot" id="screen-dot" aria-hidden="true"></span>
        <select id="screen-select" data-i18n-aria-label="top.screen"></select>
      </label>
      <div class="spacer"></div>
      <button type="button" class="icon-button" id="preferences" data-i18n-title="top.preferences" data-i18n-aria-label="top.preferences">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M15 4v4M4 12h3M11 12h9M9 10v4M4 18h11M19 18h1M17 16v4" /></svg>
      </button>
      <label class="switch" data-i18n-title="top.liveHint">
        <input type="checkbox" id="live" role="switch" />
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        <span data-i18n="top.live"></span>
      </label>
      <button type="button" class="primary-button" id="save" data-i18n="top.save"></button>
    </header>

    <main class="workspace">
      <nav class="sidebar" data-i18n-aria-label="library.title">
        <div class="tabs rail" role="tablist" aria-orientation="vertical" data-i18n-aria-label="library.title">
          <div class="tab-design" role="presentation">
            <span class="tab-domain" aria-hidden="true" data-i18n="library.design"></span>
            <button type="button" role="tab" id="tab-widgets" aria-controls="panel-widgets" aria-selected="true" data-tab="widgets" data-i18n-aria-label="library.widgets" data-i18n-title="library.widgets">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><path d="M16.5 13v7M13 16.5h7" /></svg>
              <span class="rail-label" data-i18n="library.widgets"></span>
            </button>
            <button type="button" role="tab" id="tab-sensors" aria-controls="panel-sensors" aria-selected="false" tabindex="-1" data-tab="sensors" data-i18n-aria-label="library.sensors" data-i18n-title="library.sensors">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg>
              <span class="rail-label" data-i18n="library.sensors"></span>
            </button>
            <button type="button" role="tab" id="tab-layers" aria-controls="panel-layers" aria-selected="false" tabindex="-1" data-tab="layers" data-i18n-aria-label="library.layers" data-i18n-title="library.layers">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z" /><path d="m3 13 9 5 9-5" /></svg>
              <span class="rail-label" data-i18n="library.layers"></span>
            </button>
            <button type="button" role="tab" id="tab-themes" aria-controls="panel-themes" aria-selected="false" tabindex="-1" data-tab="themes" data-i18n-aria-label="library.themes" data-i18n-title="library.themes">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" /><path d="M3 7v10M21 7v10" /></svg>
              <span class="rail-label" data-i18n="library.themes"></span>
            </button>
            <button type="button" role="tab" id="tab-media" aria-controls="panel-media" aria-selected="false" tabindex="-1" data-tab="media" data-i18n-aria-label="library.media" data-i18n-title="library.media">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="10" r="1.5" /><path d="m21 16-5-5-8 8" /></svg>
              <span class="rail-label" data-i18n="library.media"></span>
            </button>
          </div>
          <div class="tab-device" role="presentation">
            <span class="tab-domain" aria-hidden="true" data-i18n="library.device"></span>
            <button type="button" role="tab" id="tab-screen" aria-controls="panel-screen" aria-selected="false" tabindex="-1" data-tab="screen" data-i18n-aria-label="library.screen" data-i18n-title="library.screen">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" /><path d="M11 18h2" /></svg>
              <span class="rail-label" data-i18n="library.screen"></span>
            </button>
          </div>
        </div>
        <div class="library">
        <section class="panel" role="tabpanel" id="panel-widgets" aria-labelledby="tab-widgets">
          <div class="panel-head"><h2 data-i18n="library.widgets"></h2></div>
          <p class="hint" data-i18n="library.widgetsHint"></p>
          <ul class="widget-grid" id="widget-grid"></ul>
        </section>
        <section class="panel" role="tabpanel" id="panel-sensors" aria-labelledby="tab-sensors" hidden>
          <div class="panel-head"><h2 data-i18n="library.sensors"></h2></div>
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span class="visually-hidden" data-i18n="library.searchSensors"></span>
            <input type="search" id="sensor-search" data-i18n-placeholder="library.searchSensors" data-i18n-aria-label="library.searchSensors" />
          </label>
          <div class="chip-group" role="group" id="sensor-filter" data-i18n-aria-label="library.filterHardware"></div>
          <div id="sensor-list" class="sensor-list"></div>
          <p class="hint panel-foot" data-i18n="library.sensorsHint"></p>
        </section>
        <section class="panel" role="tabpanel" id="panel-layers" aria-labelledby="tab-layers" hidden>
          <div class="panel-head">
            <h2 data-i18n="library.layers"></h2>
            <span class="panel-meta" id="layer-count"></span>
            <span class="panel-tools">
              <button type="button" class="icon-button" id="layers-expand" data-i18n-title="layers.expandAll" data-i18n-aria-label="layers.expandAll">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5-5 5 5M7 15l5 5 5-5" /></svg>
              </button>
              <button type="button" class="icon-button" id="layers-collapse" data-i18n-title="layers.collapseAll" data-i18n-aria-label="layers.collapseAll">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 5 5 5-5M7 20l5-5 5 5" /></svg>
              </button>
            </span>
          </div>
          <ul class="layer-list" id="layer-list"></ul>
        </section>
        <section class="panel" role="tabpanel" id="panel-themes" aria-labelledby="tab-themes" hidden>
          <div class="panel-head">
            <h2 data-i18n="library.themes"></h2>
            <p class="panel-meta theme-count" id="theme-count" role="status"></p>
          </div>
          <div class="button-row pairs">
            <button type="button" class="text-button" id="theme-new-vertical">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2" /><path d="M12 9v6M9 12h6" /></svg>
              <span data-i18n="themes.newVertical"></span>
            </button>
            <button type="button" class="text-button" id="theme-new-horizontal">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="18" height="9" rx="2" /><path d="M12 9v6M9 12h6" /></svg>
              <span data-i18n="themes.newHorizontal"></span>
            </button>
            <button type="button" class="text-button import-button" id="theme-import">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14" /></svg>
              <span data-i18n="themes.import"></span>
            </button>
            <button type="button" class="text-button" id="theme-open">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
              <span data-i18n="themes.open"></span>
            </button>
            <button type="button" class="text-button" id="theme-save-as">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
              <span data-i18n="themes.saveAs"></span>
            </button>
          </div>
          <p class="hint" data-i18n="themes.importHint"></p>
          <div id="import-report"></div>
          <div class="theme-filter">
            <div class="segmented" role="group" id="theme-scope" data-i18n-aria-label="themes.scopeLabel">
              <button type="button" data-scope="screen" aria-pressed="false" data-i18n="themes.forScreen"></button>
              <button type="button" data-scope="all" aria-pressed="true" data-i18n="themes.all"></button>
            </div>
            <div class="segmented" role="group" id="theme-axis" data-i18n-aria-label="themes.axisLabel">
              <button type="button" data-axis="all" aria-pressed="true" data-i18n="themes.bothAxes"></button>
              <button type="button" data-axis="vertical" aria-pressed="false" data-i18n="axis.vertical"></button>
              <button type="button" data-axis="horizontal" aria-pressed="false" data-i18n="axis.horizontal"></button>
            </div>
          </div>
          <ul class="theme-grid" id="theme-grid"></ul>
          <p class="hint panel-foot" data-i18n="themes.saveAsHint"></p>
        </section>
        <section class="panel" role="tabpanel" id="panel-media" aria-labelledby="tab-media" hidden>
          <div class="panel-head"><h2 data-i18n="library.media"></h2></div>
          <div class="subtabs" role="tablist" data-i18n-aria-label="library.media">
            <button type="button" role="tab" id="subtab-media-theme" aria-controls="media-theme" aria-selected="true" data-subtab="theme" data-i18n="media.thisTheme"></button>
            <button type="button" role="tab" id="subtab-media-collection" aria-controls="media-collection" aria-selected="false" tabindex="-1" data-subtab="collection" data-i18n="media.collection"></button>
            <button type="button" role="tab" id="subtab-media-icons" aria-controls="media-icons" aria-selected="false" tabindex="-1" data-subtab="icons" data-i18n="media.icons"></button>
          </div>
          <div role="tabpanel" id="media-icons" aria-labelledby="subtab-media-icons" hidden></div>
          <div role="tabpanel" id="media-theme" aria-labelledby="subtab-media-theme">
            <div class="media-drop">
              <span class="media-drop-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 21h14" /></svg></span>
              <p class="hint" data-i18n="media.dropHint"></p>
              <p class="media-formats" data-i18n="media.formats"></p>
              <div class="button-row">
                <button type="button" class="text-button" id="media-add" data-i18n="media.add"></button>
                <button type="button" class="text-button" id="media-add-video" data-i18n="media.addVideo"></button>
              </div>
            </div>
            <p class="hint media-status" id="media-status" role="status" hidden data-i18n="media.adding"></p>
            <div class="section-head">
              <h3 data-i18n="media.inTheme"></h3>
              <span class="panel-meta" id="media-count"></span>
            </div>
            <ul class="media-list" id="media-list"></ul>
          </div>
          <div role="tabpanel" id="media-collection" aria-labelledby="subtab-media-collection" hidden>
            <button type="button" class="text-button gif-search-open" id="gif-search-open" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15zM21 21l-5.2-5.2" /></svg>
              <span data-i18n="media.searchGifs"></span>
            </button>
            <p class="hint" data-i18n="media.collectionHint"></p>
            <div id="collection-panel" class="collection"></div>
          </div>
        </section>
        <section class="panel" role="tabpanel" id="panel-screen" aria-labelledby="tab-screen" hidden>
          <div class="panel-head"><h2 data-i18n="library.screen"></h2></div>
          <div class="subtabs" role="tablist" data-i18n-aria-label="library.screen">
            <button type="button" role="tab" id="subtab-device" aria-controls="screen-device" aria-selected="true" data-subtab="device" data-i18n="screen.settingsTab"></button>
            <button type="button" role="tab" id="subtab-storage" aria-controls="screen-storage" aria-selected="false" tabindex="-1" data-subtab="storage" data-i18n="screen.storageTab"></button>
          </div>
          <div role="tabpanel" id="screen-device" aria-labelledby="subtab-device">
            <div id="screen-panel"></div>
            <section id="standby-panel" class="standby" aria-labelledby="standby-title" hidden></section>
          </div>
          <div role="tabpanel" id="screen-storage" aria-labelledby="subtab-storage" hidden>
            <div id="storage-panel" class="storage"></div>
          </div>
        </section>
        </div>
      </nav>

      <section class="stage" id="stage" data-i18n-aria-label="stage.title">
        <div class="framing-hud" id="framing-hud" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M12 8v8M8 12h8" /></svg>
          <div class="framing-hud-text">
            <strong data-i18n="framing.hudTitle"></strong>
            <span class="framing-numbers" id="framing-numbers"></span>
            <span class="framing-keys" id="framing-keys" data-i18n="framing.hudKeys"></span>
          </div>
          <button type="button" class="primary-button" id="framing-done" data-i18n="framing.done"></button>
        </div>
        <div class="stage-tools" role="group" data-i18n-aria-label="stage.tools">
          <div class="orientation-tools" role="group" data-i18n-aria-label="top.orientation">
            <div class="segmented">
              <button type="button" id="orient-vertical" aria-pressed="false" data-i18n-title="top.verticalHint">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2" /><path d="M11 18h2" /></svg>
                <span data-i18n="axis.vertical"></span>
              </button>
              <button type="button" id="orient-horizontal" aria-pressed="false" data-i18n-title="top.horizontalHint">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="18" height="9" rx="2" /><path d="M18 11v2" /></svg>
                <span data-i18n="axis.horizontal"></span>
              </button>
            </div>
            <button type="button" class="icon-button" id="orient-turn" aria-pressed="false" data-i18n-title="top.turnHint" data-i18n-aria-label="top.turn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" /></svg>
            </button>
          </div>
          <span class="tool-sep" aria-hidden="true"></span>
          <div class="toolbar" role="toolbar" data-i18n-aria-label="top.edit">
            <button type="button" class="icon-button" id="undo" data-i18n-title="top.undo" data-i18n-aria-label="top.undo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
            </button>
            <button type="button" class="icon-button" id="redo" data-i18n-title="top.redo" data-i18n-aria-label="top.redo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3" /></svg>
            </button>
            <button type="button" class="icon-button" id="copy" data-i18n-title="top.copy" data-i18n-aria-label="top.copy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V4H4v12h4" /></svg>
            </button>
            <button type="button" class="icon-button" id="paste" data-i18n-title="top.paste" data-i18n-aria-label="top.paste">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v16h14V5h-4" /><rect x="9" y="3" width="6" height="4" rx="1" /></svg>
            </button>
          </div>
        </div>
        <p class="visually-hidden" id="framing-live" aria-live="polite"></p>
        <div class="stage-scroll" id="stage-scroll">
          <div class="bezel" id="bezel">
            <div class="canvas-box" id="canvas-box">
              <canvas id="preview" width="480" height="1920" data-i18n-aria-label="stage.preview" role="img"></canvas>
              <div class="overlay" id="overlay"></div>
            </div>
          </div>
        </div>
        <div class="toolbar zoom stage-zoom" role="toolbar" data-i18n-aria-label="top.zoom">
          <button type="button" class="icon-button" id="zoom-out" data-i18n-title="top.zoomOut" data-i18n-aria-label="top.zoomOut">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button type="button" class="text-button" id="zoom-fit" data-i18n-title="top.zoomFit"><span id="zoom-label">100%</span></button>
          <button type="button" class="icon-button" id="zoom-in" data-i18n-title="top.zoomIn" data-i18n-aria-label="top.zoomIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
          </button>
        </div>
      </section>

      <aside class="inspector" id="inspector" data-i18n-aria-label="inspector.title"></aside>
    </main>

    <footer class="statusbar" role="status" aria-live="polite">
      <span id="status-main"></span>
      <span class="spacer"></span>
      <span id="status-sensors"></span>
      <span id="status-libre" hidden>
        <span id="status-libre-dot" class="status-dot" aria-hidden="true"></span>
        <span id="status-libre-label"></span>
        <button id="restart-libre" type="button" class="status-restart" data-i18n="status.libreRestart"></button>
      </span>
      <span id="status-render"></span>
      <span id="status-device"></span>
    </footer>
    <div class="toast" id="toast" role="alert" hidden></div>
  </body>
</html>
