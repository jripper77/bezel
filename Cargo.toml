[workspace]
resolver = "3"
members = [
    "crates/bezel-core",
    "crates/bezel-devices",
    "crates/bezel-sensors",
    "crates/bezel-render",
    "crates/bezel-cli",
    "crates/bezel-themes",
    "crates/bezel-media",
    "crates/bezel-klipy",
    "crates/bezel-power",
    "apps/bezel-studio/src-tauri",
]

[workspace.package]
# Inherited crate/package version; upstream CI may stamp release packages.
# Local product builds show the Bezel Evo release from VERSION instead.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/slipalison/bezel"
authors = ["Alison Amorim"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
bezel-core = { path = "crates/bezel-core" }
bezel-devices = { path = "crates/bezel-devices" }
bezel-sensors = { path = "crates/bezel-sensors" }
bezel-render = { path = "crates/bezel-render" }
bezel-themes = { path = "crates/bezel-themes" }
bezel-media = { path = "crates/bezel-media" }
bezel-klipy = { path = "crates/bezel-klipy" }
bezel-power = { path = "crates/bezel-power" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
