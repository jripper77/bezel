<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pannello sensori</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121518}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:'IBM Plex Mono',monospace}
.sect{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8B939C;margin:0}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;border:1px solid transparent;background:transparent;color:#E8EAED;font:inherit;text-align:left;cursor:grab}
.row:hover{background:#171B1F;border-color:#23282E}
</style>
</helmet>
<div style="width: 360px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #121518; color: #E8EAED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; overflow: hidden">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Sensori</h2>
    <span class="mono" style="font-size: 11px; color: #6EE7B7">● aggiornati ogni 1 s</span>
  </div>

  <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #262B31; background: #0F1214">
    <svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: #7F8890" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cerca sensori</span>
    <input type="search" placeholder="Cerca: temperatura, ventola, rete…" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #E8EAED; font: inherit; outline: none">
  </label>

  <div role="group" aria-label="Filtra per hardware" style="display: flex; flex-wrap: wrap; gap: 6px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 2px">
        <h3 class="sect" style="display: flex; justify-content: space-between; padding: 0 4px 6px"><span>{{g.name}}</span><span class="mono" style="text-transform: none; letter-spacing: 0; font-weight: 400; color: #5F6870">{{g.hw}}</span></h3>
        <sc-for list="{{g.items}}" as="s" hint-placeholder-count="3">
          <button type="button" class="row">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.label}}</span>
              <span class="mono" style="font-size: 10.5px; color: #6B747C">{{s.key}}</span>
            </span>
            <svg viewBox="0 0 60 20" width="60" height="20" aria-hidden="true"><path d="{{s.spark}}" fill="none" stroke="{{s.color}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path></svg>
            <span class="mono" style="width: 64px; text-align: right; font-size: 13px; font-weight: 600">{{s.value}}</span>
          </button>
        </sc-for>
      </section>
    </sc-for>

    <div style="display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: #1A1610; border: 1px solid #3A2E1E">
      <svg class="ic" viewBox="0 0 24 24" style="color: #FFB27A; margin-top: 1px" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.45">
        <strong>Temperatura CPU non disponibile</strong>
        <span style="color: #C9B8A6">Su Windows serve LibreHardwareMonitor in esecuzione. Bezel non inventa valori.</span>
        <button type="button" style="align-self: flex-start; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid #4A3A26; background: transparent; color: #FFD2B0; font: inherit; font-weight: 600; cursor: pointer">Avvia LibreHardwareMonitor</button>
      </div>
    </div>
  </div>

  <p style="margin: 0; padding-top: 10px; border-top: 1px solid #1D2227; font-size: 11.5px; color: #7F8890; line-height: 1.45">Trascina un sensore su un widget per collegarlo, o nel vuoto per creare un nuovo valore.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (on) => 'height: 28px; padding: 0 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; ' +
      (on ? 'border: 1px solid #4A3424; background: #1F1813; color: #FFB27A' : 'border: 1px solid #262B31; background: transparent; color: #AEB5BD');
    const filters = ['Tutti', 'CPU', 'GPU', 'Memoria', 'Rete', 'Dischi'].map((label, i) => ({ label, pressed: i === 0 ? 'true' : 'false', style: chip(i === 0) }));
    return {
      filters,
      groups: [
        { name: 'Processore', hw: 'Ryzen 7 7800X3D', items: [
          { label: 'Utilizzo', key: 'cpu.usage', value: '38%', color: '#38BDF8', spark: 'M0 14 L8 12 L16 15 L24 8 L32 10 L40 5 L48 9 L60 7' },
          { label: 'Frequenza media', key: 'cpu.frequency', value: '4,84 GHz', color: '#38BDF8', spark: 'M0 8 L10 9 L20 7 L30 8 L40 6 L50 8 L60 7' },
          { label: 'Potenza package', key: 'cpu.power', value: '59 W', color: '#38BDF8', spark: 'M0 15 L10 12 L20 13 L30 9 L40 11 L50 6 L60 9' }
        ] },
        { name: 'Scheda video', hw: 'RTX 4070', items: [
          { label: 'Utilizzo', key: 'gpu.usage', value: '24%', color: '#FB923C', spark: 'M0 16 L10 15 L20 12 L30 14 L40 10 L50 13 L60 12' },
          { label: 'Temperatura', key: 'gpu.temperature', value: '42 °C', color: '#FB923C', spark: 'M0 12 L10 12 L20 11 L30 11 L40 10 L50 10 L60 10' },
          { label: 'Potenza', key: 'gpu.power', value: '178 W', color: '#FB923C', spark: 'M0 6 L10 8 L20 5 L30 9 L40 4 L50 7 L60 5' }
        ] },
        { name: 'Memoria', hw: '32 GB DDR5', items: [
          { label: 'Utilizzo', key: 'memory.percent', value: '61%', color: '#A78BFA', spark: 'M0 9 L60 8' },
          { label: 'In uso', key: 'memory.used', value: '22,9 GB', color: '#A78BFA', spark: 'M0 9 L30 9 L40 8 L60 8' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
