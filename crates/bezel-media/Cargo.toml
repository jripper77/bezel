[package]
name = "bezel-media"
description = "Driven adapter of Bezel for media files on the host: native MP4 and image probing, conversion and decoding through an external ffmpeg."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bezel-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The size of still images from their headers, and the album's photos
# (`photo`): decoded with their EXIF orientation and encoded as PNG.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# The folder that holds conversion outputs, removed with the transcoder.
tempfile = "3.27.0"
# Content ids of the local copies of what Bezel sends (SHA-256).
sha2 = "0.10.9"

[lints]
workspace = true
